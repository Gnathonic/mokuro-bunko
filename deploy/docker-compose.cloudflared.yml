# mokuro-bunko behind a Cloudflare Tunnel (no published ports).
#
# Prerequisites:
# 1. Create a Cloudflare tunnel: cloudflared tunnel create mokuro
# 2. Route it to http://mokuro-bunko:8080 and export its token as
#    CLOUDFLARE_TUNNEL_TOKEN.
#
# Usage:
#   docker compose -f deploy/docker-compose.cloudflared.yml up -d
services:
  mokuro-bunko:
    image: ghcr.io/gnathonic/mokuro-bunko:latest
    container_name: mokuro-bunko
    restart: unless-stopped
    volumes:
      - mokuro-data:/data
    environment:
      - PUID=1000
      - PGID=1000
      - MOKURO_STORAGE=/data
      - MOKURO_CONFIG=/data/config.yaml
      - MOKURO_REGISTRATION_MODE=invite
    networks:
      - mokuro-net
    # No ports exposed - traffic goes through cloudflared

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mokuro-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - mokuro-net
    depends_on:
      - mokuro-bunko

networks:
  mokuro-net:
    driver: bridge

volumes:
  mokuro-data:
    driver: local
