# mokuro-bunko with local OCR. The image carries no OCR backend: the first start
# detects the GPU the container is given and downloads the matching backend pack into
# the data volume (CPU about 100 MB, NVIDIA about 2 GB, AMD about 3 GB), then the
# enabled engines' models; later starts reuse them. Uncomment the NVIDIA or AMD lines
# below for GPU OCR; for a small server without OCR use docker-compose.lite.yml.
#
#   docker compose -f deploy/docker-compose.yml up -d
services:
  mokuro-bunko:
    image: ghcr.io/gnathonic/mokuro-bunko:latest
    # Or build it yourself:
    # build:
    #   context: ..
    #   dockerfile: deploy/docker/Dockerfile
    container_name: mokuro-bunko
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - mokuro-data:/data
      # To start from your own config file, mount it where MOKURO_CONFIG
      # points. It must be writable: the admin panel saves settings to it.
      # - ./config.yaml:/data/config.yaml
    environment:
      # The server runs as this user/group (the 0.5 image's `mokuro` user was 1000).
      - PUID=1000
      - PGID=1000
      - MOKURO_STORAGE=/data
      # config.yaml lives in the data volume, so admin-panel changes persist.
      - MOKURO_CONFIG=/data/config.yaml
      # First run: create the admin account (ignored once one exists). Without
      # these, the log shows a one-time setup code for http://HOST:8080/setup.
      # - MOKURO_ADMIN_USERNAME=admin
      # - MOKURO_ADMIN_PASSWORD=change-me-please
      - MOKURO_REGISTRATION_MODE=self
      # nginx in front, serving library downloads via X-Accel-Redirect:
      # - MOKURO_NGINX_ACCEL=1
      # auto (default: the GPU the container is given), cuda, rocm, cpu, or skip:
      # - MOKURO_OCR_BACKEND=cpu
      # No automatic OCR backend download on start (then run install-ocr yourself):
      # - MOKURO_OCR_AUTO_INSTALL=false
    # NVIDIA GPU (driver >= 580 and the NVIDIA container toolkit on the host):
    # gpus: all
    # AMD GPU (Radeon RX 6000/7000/9000, Linux):
    # devices:
    #   - /dev/kfd
    #   - /dev/dri
    # The image has a HEALTHCHECK (`mokuro-bunko healthcheck`); its start period
    # covers the first start's OCR backend download.

volumes:
  mokuro-data:
    driver: local
