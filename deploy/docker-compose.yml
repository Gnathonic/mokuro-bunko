# mokuro-bunko with local OCR on the CPU (the image carries the CPU OCR backend pack;
# the models are downloaded into the data volume on first use). For an NVIDIA GPU use
# docker-compose.unraid-cuda.yml (image :latest-cuda); for a small server without OCR
# use docker-compose.lite.yml.
#
#   docker compose -f deploy/docker-compose.yml up -d
services:
  mokuro-bunko:
    image: ghcr.io/gnathonic/mokuro-bunko:latest
    # Or build it yourself:
    # build:
    #   context: ..
    #   dockerfile: deploy/docker/Dockerfile
    container_name: mokuro-bunko
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - mokuro-data:/data
      # To start from your own config file, mount it where MOKURO_CONFIG
      # points. It must be writable: the admin panel saves settings to it.
      # - ./config.yaml:/data/config.yaml
    environment:
      # The server runs as this user/group (the 0.5 image's `mokuro` user was 1000).
      - PUID=1000
      - PGID=1000
      - MOKURO_STORAGE=/data
      # config.yaml lives in the data volume, so admin-panel changes persist.
      - MOKURO_CONFIG=/data/config.yaml
      - MOKURO_REGISTRATION_MODE=self
      # nginx in front, serving library downloads via X-Accel-Redirect:
      # - MOKURO_NGINX_ACCEL=1
    # The image has a HEALTHCHECK (`mokuro-bunko healthcheck`).

volumes:
  mokuro-data:
    driver: local
