# A remote OCR processor on a GPU machine, working for a mokuro-bunko library
# elsewhere (protocol: docs/rust-port/PROTOCOL.md). processor.yaml (library URL,
# processor account) goes in ./processor/. Before `processor serve` the first start
# downloads the OCR backend pack for the GPU the container is given into the volume
# (NVIDIA: `gpus: all`, driver >= 580 and the NVIDIA container toolkit, about 2 GB;
# AMD: the `devices` lines below, about 3 GB; neither: the CPU), with the models;
# later starts reuse them. MOKURO_OCR_BACKEND=cpu|cuda|rocm overrides the choice.
#
#   docker compose -f deploy/docker-compose.processor.yml up -d
services:
  processor:
    image: ghcr.io/gnathonic/mokuro-bunko:latest
    container_name: mokuro-bunko-processor
    restart: unless-stopped
    command: ["processor", "serve", "--config", "/config/processor.yaml"]
    volumes:
      - ./processor:/config
      - processor-data:/data
    environment:
      - PUID=1000
      - PGID=1000
    # The processor only dials out; no ports. No healthcheck needed.
    healthcheck:
      disable: true
    # NVIDIA GPU:
    gpus: all
    # AMD GPU (Radeon RX 6000/7000/9000, Linux) instead of `gpus`:
    # devices:
    #   - /dev/kfd
    #   - /dev/dri

volumes:
  processor-data:
    driver: local
