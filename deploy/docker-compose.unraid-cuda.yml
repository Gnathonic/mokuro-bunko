# Unraid / NVIDIA: mokuro-bunko with OCR on an NVIDIA GPU (successor of the 0.5
# unraid-cuda image; :latest-cuda is the same image as :latest). Once it serves, it
# downloads in the background the cu130 OCR backend pack (libtorch + the CUDA 13 libraries, about 2 GB)
# into /data/backends and the enabled engines' models into /data/models; later starts
# reuse them. The host needs an NVIDIA driver >= 580 and the NVIDIA container toolkit
# (Unraid: the Nvidia-Driver plugin). Turing (RTX 20xx / GTX 16xx) or newer.
services:
  mokuro-bunko:
    image: ghcr.io/gnathonic/mokuro-bunko:beta  # :latest from 0.7.0 on
    # build:
    #   context: ..
    #   dockerfile: deploy/docker/Dockerfile
    container_name: mokuro-bunko
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /mnt/user/appdata/mokuro-bunko/data:/data
      - /mnt/user/appdata/mokuro-bunko/config:/config
    environment:
      - PUID=99
      - PGID=100
      - UMASK=002
      - MOKURO_CONFIG=/config/config.yaml
      # First run: create the admin account (ignored once one exists). Without
      # these, the log shows a one-time setup code for http://HOST:8080/setup.
      # - MOKURO_ADMIN_USERNAME=admin
      # - MOKURO_ADMIN_PASSWORD=change-me-please
      - MOKURO_OCR_BACKEND=auto
      # No automatic OCR backend download on start (then run install-ocr yourself):
      # - MOKURO_OCR_AUTO_INSTALL=false
      # OCR generations as JSON (or leave unset and edit them in the admin
      # panel, which saves config.yaml). Engines: hayai-nova, paddle-manga, ppocr-manga.
      # - 'MOKURO_OCR_GENERATIONS=[{"name":"ppocr-manga","engine":"ppocr-manga","primary":true}]'
      # No OCR in this container; a remote processor runs the queue:
      # - MOKURO_OCR_LOCAL_PROCESSING=false
      # nginx in front, serving library downloads via X-Accel-Redirect:
      # - MOKURO_NGINX_ACCEL=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    gpus: all
