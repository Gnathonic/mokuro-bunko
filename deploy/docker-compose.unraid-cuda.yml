version: "3.8"

services:
  mokuro-bunko:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.unraid
    image: mokuro-bunko:unraid-cuda
    container_name: mokuro-bunko
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /mnt/user/appdata/mokuro-bunko/data:/data
      - /mnt/user/appdata/mokuro-bunko/config:/config
    environment:
      - PUID=99
      - PGID=100
      - UMASK=002
      - MOKURO_CONFIG=/config/config.yaml
      - MOKURO_OCR_BACKEND=auto
      - MOKURO_BUNKO_OCR_ENV=/data/.ocr-env
      # Second env for the hayai-nova / paddle-manga / ppocr-manga engines,
      # installed at startup when a configured OCR generation needs it.
      - MOKURO_BUNKO_OCR_ENGINES_ENV=/data/.ocr-engines-env
      # OCR generations as JSON (or leave unset and edit them in the admin
      # panel, which saves config.yaml):
      # - 'MOKURO_OCR_GENERATIONS=[{"name":"mokuro","engine":"mokuro","primary":true},{"name":"hayai-nova","engine":"hayai-nova","detector":"ppocr-manga"}]'
      # No OCR in this container; a remote processor runs the queue:
      # - MOKURO_OCR_LOCAL_PROCESSING=false
      - OCR_AUTO_INSTALL=false
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    # For compose v2:
    gpus: all
