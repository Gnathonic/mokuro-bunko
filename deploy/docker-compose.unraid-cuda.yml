# Unraid / NVIDIA: mokuro-bunko with OCR on an NVIDIA GPU (successor of the 0.5
# unraid-cuda image). The image carries the cu130 OCR backend pack (libtorch + the
# CUDA 13 libraries); the host needs an NVIDIA driver >= 580 and the NVIDIA container
# toolkit (Unraid: the Nvidia-Driver plugin). The OCR models are downloaded into the
# data volume on first use. Turing (RTX 20xx / GTX 16xx) or newer.
services:
  mokuro-bunko:
    image: ghcr.io/gnathonic/mokuro-bunko:latest-cuda
    # build:
    #   context: ..
    #   dockerfile: deploy/docker/Dockerfile.cuda
    container_name: mokuro-bunko
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /mnt/user/appdata/mokuro-bunko/data:/data
      - /mnt/user/appdata/mokuro-bunko/config:/config
    environment:
      - PUID=99
      - PGID=100
      - UMASK=002
      - MOKURO_CONFIG=/config/config.yaml
      - MOKURO_OCR_BACKEND=auto
      # Image built with BAKE_PACK=0 (no pack inside): install it into /data/backends
      # on first start, as the 0.5 image installed its CUDA torch:
      # - OCR_AUTO_INSTALL=true
      # OCR generations as JSON (or leave unset and edit them in the admin
      # panel, which saves config.yaml). Engines: hayai-nova, paddle-manga, ppocr-manga.
      # - 'MOKURO_OCR_GENERATIONS=[{"name":"ppocr-manga","engine":"ppocr-manga","primary":true}]'
      # No OCR in this container; a remote processor runs the queue:
      # - MOKURO_OCR_LOCAL_PROCESSING=false
      # nginx in front, serving library downloads via X-Accel-Redirect:
      # - MOKURO_NGINX_ACCEL=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    gpus: all
