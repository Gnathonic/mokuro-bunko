[package]
name = "bunko-sched"
description = "Pure OCR scheduling math: queue order, rate model, earliest-finish lanes, queue plan, congestion, failure backoff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `preserve_order`: the loosely typed cards and records are Python dicts in
# 0.5.2, whose key order is insertion order and shows in every file written.
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
thiserror.workspace = true
unicode-normalization = "0.1.24"

[dev-dependencies]
tempfile.workspace = true
