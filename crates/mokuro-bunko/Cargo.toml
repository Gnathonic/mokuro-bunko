[package]
name = "mokuro-bunko"
description = "Self-hosted manga library server with WebDAV, OCR and multi-user support"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "mokuro-bunko"

[[bin]]
name = "mokuro-bunko"
path = "src/main.rs"

[features]
# `lite`: no default features — server only, OCR by remote processors, no tray.
default = ["ocr", "tray"]
# The desktop tray (`mokuro-bunko tray`; bunko-tray): a StatusNotifierItem over D-Bus on
# Linux (no GUI toolkit linked), tray-icon/tao on Windows and macOS. Part of the full
# build; the static lite build (Linux arm64 server, the lite Docker image) has none.
tray = ["dep:bunko-tray"]
# Local OCR + the `processor` subcommand: ONNX Runtime (CPU) for ppocr-manga, and the
# recognizers on libtorch through a backend pack loaded at run time (`torch`; the binary
# never links libtorch, `install-ocr` fetches the pack). JPEG pages decode with
# libjpeg-turbo, as 0.5.2's Pillow did (bit-identical pages). This is the `full` flavor.
ocr = ["dep:bunko-engines", "dep:bunko-ocr", "dep:bunko-processor", "dep:bunko-proto", "bunko-ocr/libjpeg", "bunko-engines/libjpeg", "bunko-engines/torch"]
# ONNX Runtime GPU execution providers (each implies `ocr`): deferred in 0.7. They keep
# compiling (CI checks them) but no release ships them; see PACKAGING.md §1.
cuda = ["ocr", "bunko-engines/cuda"]
webgpu = ["ocr", "bunko-engines/webgpu"]
directml = ["ocr", "bunko-engines/directml"]
coreml = ["ocr", "bunko-engines/coreml"]

[dependencies]
bunko-core.workspace = true
bunko-db.workspace = true
bunko-server.workspace = true
bunko-update.workspace = true
bunko-tray = { path = "../bunko-tray", optional = true }
# full build only (feature `ocr`): the engines, the model store, the processor runtime
bunko-engines = { path = "../bunko-engines", optional = true }
bunko-ocr = { workspace = true, optional = true }
bunko-processor = { workspace = true, optional = true }
bunko-proto = { workspace = true, optional = true }
reqwest.workspace = true
time.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
mimalloc = { version = "0.1", default-features = false }
# `ssl status`: certificate subject/validity/SANs (same version bunko-server uses).
x509-parser = "0.16"
# Hidden password prompts on a terminal.
rpassword = "7"
# `doctor` disk-space check (statvfs / GetDiskFreeSpaceEx); `gui` asks whether a tray
# holds its lock.
fs4 = { version = "1", default-features = false, features = ["sync"] }
# `gui`: the desktop app pages' backend (same axum as bunko-server), its SSE streams,
# the control token.
bunko-control = { path = "../bunko-control" }
axum.workspace = true
serde.workspace = true
futures-util.workspace = true
rand.workspace = true
parking_lot.workspace = true
# `serve` / `processor serve` control API pollers (the servers' stop tokens).
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
# `gui`: stopping the user's running tray so it re-reads tray.json.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# `gui` on a double-click: is this console ours alone (started from Explorer)? Whether a
# process it started is still running (gui::spawn::pid_alive).
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
# The tray's Startup-folder shortcut (the same `Mokuro Bunko.lnk` the tray and
# install.ps1 -Startup write).
mslnk = "0.1"

[dev-dependencies]
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
assert_cmd = "2"
predicates = "3"
