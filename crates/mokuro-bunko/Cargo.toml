[package]
name = "mokuro-bunko"
description = "Self-hosted manga library server with WebDAV, OCR and multi-user support"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "mokuro-bunko"

[[bin]]
name = "mokuro-bunko"
path = "src/main.rs"

[features]
# `lite`: no default features — server only, OCR by remote processors.
default = ["ocr"]
# Local OCR + the `processor` subcommand (links ONNX Runtime).
ocr = []
# Execution providers (each implies `ocr`).
cuda = ["ocr"]
webgpu = ["ocr"]
directml = ["ocr"]
coreml = ["ocr"]

[dependencies]
bunko-core.workspace = true
bunko-db.workspace = true
bunko-server.workspace = true
bunko-update.workspace = true
reqwest.workspace = true
time.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
mimalloc = { version = "0.1", default-features = false }
# `ssl status`: certificate subject/validity/SANs (same version bunko-server uses).
x509-parser = "0.16"
# Hidden password prompts on a terminal.
rpassword = "7"
# `doctor` disk-space check (statvfs / GetDiskFreeSpaceEx).
fs4 = { version = "1", default-features = false }

[dev-dependencies]
tempfile.workspace = true
assert_cmd = "2"
predicates = "3"
