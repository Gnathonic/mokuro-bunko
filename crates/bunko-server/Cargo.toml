[package]
name = "bunko-server"
description = "The mokuro-bunko library server: WebDAV, web UIs, APIs and the OCR scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []

[dependencies]
bunko-core.workspace = true
bunko-proto.workspace = true
bunko-db.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
futures-util.workspace = true
axum = { workspace = true, features = ["ws"] }
tower.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1"] }
bytes.workspace = true
tracing.workspace = true
parking_lot.workspace = true
rust-embed.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
time.workspace = true
ipnet = "2"
hostname = "0.4"
x509-parser = "0.16"
base64.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
which = "7"
# accounts: one-time setup token generation
rand.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
