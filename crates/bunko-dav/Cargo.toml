[package]
name = "bunko-dav"
description = "The mokuro-bunko WebDAV layer: every DAV method over the library and per-user files"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bunko-core.workspace = true
axum.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
percent-encoding.workspace = true
quick-xml.workspace = true
zip.workspace = true
rand.workspace = true
time.workspace = true
# PROPFIND cache: the shared listing is kept gzip-compressed (memory budget).
flate2 = "1"
crc32fast = "1"
# HTTP-date parsing/formatting (RFC 1123, RFC 850 and asctime, as WsgiDAV accepts).
httpdate = "1"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
reqwest.workspace = true
