[package]
name = "bunko-tray"
description = "mokuro-bunko desktop tray (`mokuro-bunko tray`): status, pause/resume, open the app pages, supervise a tray-managed server or processor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A library: `mokuro-bunko tray` (feature `tray` of the mokuro-bunko crate, on in the
# full build) runs it in the main program (GUI.md §1). No GUI toolkit on Linux: the
# tray is a StatusNotifierItem over D-Bus (ksni, pure Rust), so neither GTK nor
# AppIndicator is needed and a headless full build still starts.

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
# Loopback HTTP to the control API (plain http, no TLS stack).
ureq = { version = "3", default-features = false }
# Local wall-clock times for "pause until tomorrow 08:00" and status lines.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Decoding the embedded tray icons to RGBA.
png = "0.18"
# Opening the app pages and the logs folder with the desktop's default handler.
open = "5"
# One tray per user (a lock file), as bunko-processor locks its storage.
fs4 = { version = "1", default-features = false, features = ["sync"] }
# The control API's wire types and its `.control.json` checks (no runtime: no axum or
# tokio); tests/contract.rs checks the tray reads exactly what the instances send.
bunko-control = { path = "../bunko-control", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# The Linux tray: a KDE/freedesktop StatusNotifierItem + com.canonical.dbusmenu menu over
# the session bus (zbus, pure Rust; ksni is Unlicense, zbus MIT). Shown by KDE, Xfce,
# LXQt, Cinnamon, ... and by GNOME with the AppIndicator extension.
ksni = { version = "0.3.6", default-features = false, features = ["tokio"] }
# `mokuro-bunko doctor`: is there a session bus and a StatusNotifier host (session.rs).
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { workspace = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# The Windows/macOS tray: tray-icon + muda menus + the tao event loop (MIT/Apache-2.0).
tray-icon = { version = "0.24", default-features = false }
tao = { version = "0.34", default-features = false, features = ["rwh_06"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The Startup-folder shortcut that "Start at login" toggles (the same file install.ps1 -Startup writes).
mslnk = "0.1"
# Whether a server or processor the tray watches is still running (discover::pid_alive).
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
