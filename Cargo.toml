[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.7.0-beta.1"
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
repository = "https://github.com/Gnathonic/mokuro-bunko"

[workspace.dependencies]
bunko-core = { path = "crates/bunko-core" }
bunko-db = { path = "crates/bunko-db" }
bunko-library = { path = "crates/bunko-library" }
bunko-dav = { path = "crates/bunko-dav" }
bunko-ocr = { path = "crates/bunko-ocr" }
bunko-proto = { path = "crates/bunko-proto" }
bunko-server = { path = "crates/bunko-server" }
bunko-processor = { path = "crates/bunko-processor" }
bunko-update = { path = "crates/bunko-update" }
bunko-sched = { path = "crates/bunko-sched" }
bunko-layout = { path = "crates/bunko-layout" }
bunko-vlm = { path = "crates/bunko-vlm" }
bunko-engines = { path = "crates/bunko-engines" }
bunko-thumb = { path = "crates/bunko-thumb" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header", "trace", "limit"] }
hyper = "1"
http = "1"
http-body-util = "0.1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.37", features = ["bundled"] }
bcrypt = "0.17"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
parking_lot = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
percent-encoding = "2"
quick-xml = "0.37"
natord = "1"
uuid = { version = "1", features = ["v4"] }
semver = "1"
ndarray = "0.16"
ort = { version = "=2.0.0-rc.13", default-features = false }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
