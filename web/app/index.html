<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokuro Bunko</title>
    <link rel="stylesheet" href="/_static/shared.css">
    <link rel="stylesheet" href="/app/app.css">
</head>
<body>
    <header class="mokuro-header" id="app-header" data-current="home"></header>
    <main class="app-main">
        <h1 class="page-title">Mokuro Bunko</h1>
        <p class="page-lede" id="home-lede">What should this machine do?</p>
        <div class="alert alert--error" id="home-error" hidden></div>

        <section aria-labelledby="running-title" class="panel" id="running-panel" hidden>
            <h2 id="running-title">Running here</h2>
            <ul class="link-list" id="running-list"></ul>
        </section>

        <div class="choice-grid choice-grid--two" id="home-choices">
            <a class="choice" href="#server" id="choice-server">
                <span class="choice__title">Library server</span>
                <span class="choice__text">Keep the manga library here and serve it to readers.</span>
                <span class="choice__state" id="state-server"></span>
            </a>
            <a class="choice" href="/app/setup/processor" id="choice-processor">
                <span class="choice__title">Processor</span>
                <span class="choice__text">Read OCR for a library on another machine.</span>
                <span class="choice__state" id="state-processor"></span>
            </a>
        </div>

        <section class="panel mt-4" id="server-start" aria-labelledby="server-start-title" hidden>
            <h2 id="server-start-title">Library server</h2>
            <div class="form-group">
                <label class="form-label" for="storage">Library folder</label>
                <div class="input-row">
                    <input class="form-input" id="storage" autocomplete="off">
                    <button type="button" class="btn btn--secondary" data-pick="storage" data-title="Choose the library folder">Browse…</button>
                </div>
                <p class="form-hint">Manga go in its <code>library</code> folder.</p>
                <div class="alert alert--warning" id="storage-note" role="status" hidden></div>
            </div>
            <div class="panel__footer"><span class="spacer"></span><button type="button" class="btn btn--primary" id="server-go">Start</button></div>
            <p class="form-hint" id="server-status" role="status"></p>
        </section>
    </main>
    <script src="/app/app.js"></script>
    <script src="/app/home.js"></script>
</body>
</html>
