<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR install - Mokuro Bunko</title>
    <link rel="stylesheet" href="/_static/shared.css">
    <link rel="stylesheet" href="/app/app.css">
</head>
<body>
    <header class="mokuro-header" id="app-header" data-current="setup"></header>
    <main class="app-main app-main--narrow">
        <h1 class="page-title">OCR on this machine</h1>
        <p class="page-lede">Installs the OCR backend pack that fits this machine's GPU (or the CPU) and downloads the models (<code>mokuro-bunko install-ocr</code>), then checks everything (<code>doctor</code>).</p>
        <div class="wizard-card">
            <section aria-labelledby="h-for">
                <h2 id="h-for" class="section-title">For</h2>
                <div class="radio-cards" id="for-cards">
                    <label class="radio-card"><input type="radio" name="for" value="server" checked><div class="radio-card__content"><strong>The library server on this machine</strong><span id="for-server-path"></span></div></label>
                    <label class="radio-card"><input type="radio" name="for" value="processor"><div class="radio-card__content"><strong>The processor on this machine</strong><span id="for-proc-path"></span></div></label>
                </div>
            </section>

            <section aria-labelledby="h-hw" class="mt-4">
                <h2 id="h-hw" class="section-title">This machine</h2>
                <dl class="kv" id="hw"><dt>Hardware</dt><dd>Detecting…</dd></dl>
                <p class="form-hint mt-2" id="hw-hint" hidden></p>
                <div id="packs" class="mt-2"></div>
            </section>

            <section aria-labelledby="h-pack" class="mt-4">
                <h2 id="h-pack" class="section-title">Backend pack</h2>
                <div class="form-group">
                    <label class="form-label" for="variant">Pack</label>
                    <select class="form-select" id="variant">
                        <option value="auto">Automatic</option>
                        <option value="cpu">CPU (any machine)</option>
                        <option value="cu130">NVIDIA GPU (CUDA 13, driver 580 or newer)</option>
                        <option value="rocm7.1">AMD GPU (ROCm 7.1, Linux)</option>
                    </select>
                </div>
                <details class="mb-3">
                    <summary class="form-label" style="cursor:pointer">More options</summary>
                    <div class="form-group mt-2">
                        <label class="form-label" for="from">Install from a folder instead of downloading (air-gapped machines)</label>
                        <div class="input-row"><input class="form-input" id="from" placeholder="a folder holding mokuro-bunko-*-torch-*.tar.zst"><button type="button" class="btn btn--secondary" data-pick="from" data-title="Folder with the pack archive">Browse…</button></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="dir">Install packs into (default: the role's storage/backends)</label>
                        <div class="input-row"><input class="form-input" id="dir"><button type="button" class="btn btn--secondary" data-pick="dir" data-title="Where to install packs">Browse…</button></div>
                    </div>
                    <label class="check"><input type="checkbox" id="force"> Reinstall even if the pack is already there</label>
                    <label class="check"><input type="checkbox" id="no-models"> Only the pack, not the models</label>
                </details>
                <div class="wizard-actions"><a class="btn btn--ghost" href="/app/setup">Back</a><span class="spacer"></span><button type="button" class="btn btn--primary" id="install-btn">Install</button></div>
                <p class="form-error" id="err-install" role="alert" hidden></p>
            </section>

            <div id="install-job"></div>
            <div id="doctor-job"></div>
            <section id="ocr-done" hidden class="mt-4" aria-labelledby="h-odone">
                <h2 id="h-odone" class="section-title">Next</h2>
                <ul class="link-list" id="ocr-next"></ul>
            </section>
        </div>
    </main>
    <script src="/app/app.js"></script>
    <script src="/app/setup-ocr.js"></script>
</body>
</html>
