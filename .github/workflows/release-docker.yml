# The release's Docker images, shared by release.yml and release-check.yml: the lite
# image (linux/amd64 + linux/arm64) and the full image (linux/amd64), built from the
# release binaries of this run (the `dist-linux-*` artifacts of release-build.yml, and
# `docker-linux-x64-server`: the static x86_64 server, not a release file).
#
# Pushes only with `push: true`, which release.yml passes together with
# `packages: write`. release-check.yml passes `push: false` and grants no package
# permission: the images are built, nothing logs in, nothing leaves the runner.
name: Release images

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build
        required: true
        type: string
      version:
        description: The workspace version (the images' tag)
        required: true
        type: string
      image:
        description: Image name, e.g. ghcr.io/<owner>/mokuro-bunko
        required: true
        type: string
      push:
        description: Log in to ghcr.io and push the versioned tags
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-linux-*
          path: dist
          merge-multiple: true
      # The static x86_64 server of the lite image (not a release file).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docker-linux-*
          path: dist
          merge-multiple: true
      # The images reuse the release binaries (BIN_FROM=prebuilt): no second compile,
      # and the arm64 lite image needs no emulated build. No backend pack and no model
      # goes into any image: the full image downloads the pack its container's GPU
      # needs from this release on first start (PACKAGING.md §2). Never pass
      # --bake-pack here.
      - name: docker context (release binaries + bunko-init per arch)
        run: cargo run -q -p xtask --locked -- docker-context --version "$VERSION" --dir dist --out dist/docker --zig
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: lite (static musl on distroless)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile.lite
          platforms: linux/amd64,linux/arm64
          build-args: |
            BIN_FROM=prebuilt
            VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-lite
          push: ${{ inputs.push }}
      # One full image for CPU, NVIDIA and AMD (the pack is downloaded on first start),
      # also tagged -cuda so templates written for the 0.5.2 CUDA image keep working.
      - name: full (local OCR, backend downloaded on first start; optional nginx)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            BIN_FROM=prebuilt
            BAKE_PACK=0
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.VERSION }}-cuda
          push: ${{ inputs.push }}
      # The check only: the amd64 images run from the local daemon (one platform can be
      # loaded; the arm64 lite image was built above).
      - name: load and run the amd64 images (not pushed)
        if: ${{ !inputs.push }}
        run: |
          set -eux
          docker buildx build --load --platform linux/amd64 -f deploy/docker/Dockerfile.lite \
            --build-arg BIN_FROM=prebuilt --build-arg VERSION="$VERSION" -t "check-lite:$VERSION" .
          docker buildx build --load --platform linux/amd64 -f deploy/docker/Dockerfile \
            --build-arg BIN_FROM=prebuilt --build-arg BAKE_PACK=0 --build-arg VERSION="$VERSION" -t "check-full:$VERSION" .
          docker run --rm "check-lite:$VERSION" --version | tee /dev/stderr | grep -F "$VERSION"
          docker run --rm --entrypoint /opt/mokuro-bunko/mokuro-bunko "check-full:$VERSION" --version | tee /dev/stderr | grep -F "$VERSION"
          docker image ls
