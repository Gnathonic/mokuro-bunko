# The owner's approval step. After release.yml has built a tag into a DRAFT release
# and versioned images, run this workflow by hand to publish it:
#   * re-verifies release.json's signature against the key compiled into bunko-update,
#   * un-drafts the GitHub release (so .../releases/latest/download/release.json, which
#     every installed server polls, now points at it),
#   * for a stable version, moves the `latest`, `latest-lite` and `latest-cuda` image tags.
name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.7.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: validate tag
        run: printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the draft has a manifest that verifies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          mkdir -p check
          gh release download "$TAG" --dir check --pattern release.json --pattern release.json.sig
          cargo run -q -p xtask --locked -- verify check/release.json
      - name: un-draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          version="${TAG#v}"
          case "$version" in
            *-*) gh release edit "$TAG" --draft=false --prerelease ;;
            *) gh release edit "$TAG" --draft=false --latest ;;
          esac
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: move the latest* image tags (stable versions only)
        run: |
          set -eux
          version="${TAG#v}"
          case "$version" in *-*) echo "pre-release: latest tags unchanged"; exit 0 ;; esac
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/mokuro-bunko"
          docker buildx imagetools create -t "$image:latest" "$image:$version"
          docker buildx imagetools create -t "$image:latest-lite" "$image:$version-lite"
          docker buildx imagetools create -t "$image:latest-cuda" "$image:$version-cuda"
