# The build half of a release, shared by release.yml (a `v*` tag) and release-check.yml
# (a dry run on any branch): tests, every platform archive, the macOS disk images, the
# OCR backend packs and (opt-in) the Android APK, each uploaded as a workflow artifact
# (`dist-*`, `pack-*`, `android-apk`). It signs, publishes and pushes nothing, uses no
# secret except the optional Android keystore, and needs only `contents: read`: the
# caller's release job signs release.json and drafts the release from these artifacts.
# See docs/rust-port/PACKAGING.md §5.
name: Release build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to build
        required: true
        type: string
      version:
        description: The workspace version (Cargo.toml), e.g. 0.7.0-beta.1
        required: true
        type: string
      epoch:
        description: SOURCE_DATE_EPOCH (the commit time) for reproducible archives
        required: true
        type: string
      android:
        description: Also build the Android APK
        type: boolean
        default: false
      retention-days:
        description: How long the artifacts are kept (0 = the repository's default)
        type: number
        default: 0
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SOURCE_DATE_EPOCH: ${{ inputs.epoch }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # bunko-tray links GTK 3 on Linux (the desktop tray; the CLI does not).
      - run: sudo apt-get update -q && sudo apt-get install -y -q libgtk-3-dev
      - run: cargo test --workspace --locked

  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux lite: fully static musl, cross-built with zig. x86_64 lite is the
          # `build-linux-x64-lite` job: it takes the tray from the manylinux job.
          - { name: linux-arm64-lite, os: ubuntu-latest, target: aarch64-unknown-linux-musl, flavor: lite, zig: true }
          # Full: one binary per platform (ONNX Runtime on the CPU for PP-OCR; the
          # recognizers come from the backend packs). Linux x86_64 full is built by the
          # `build-linux-full` job (manylinux_2_28). The ONNX Runtime GPU flavors
          # (full-cuda, DirectML, CoreML, WebGPU) are not released any more, and there is
          # no Linux arm64 / Intel macOS full build (no backend pack for them).
          - { name: windows-x64-full, os: windows-latest, target: x86_64-pc-windows-msvc, flavor: full }
          - { name: windows-x64-lite, os: windows-latest, target: x86_64-pc-windows-msvc, flavor: lite }
          # macOS: the .tar.gz (what the updater and install.sh take) and the
          # drag-to-Applications disk image of the same build (packaging/macos/make-dmg.sh).
          - { name: macos-arm64-full, os: macos-latest, target: aarch64-apple-darwin, flavor: full }
          - { name: macos-arm64-lite, os: macos-latest, target: aarch64-apple-darwin, flavor: lite }
          - { name: macos-x64-lite, os: macos-latest, target: x86_64-apple-darwin, flavor: lite }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      FLAVOR: ${{ matrix.flavor }}
      ZIG: ${{ matrix.zig }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.zig
        uses: mlugg/setup-zig@v2
      - if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: xtask dist
        run: |
          set -eux
          args=(--locked --target "$TARGET" --flavor "$FLAVOR" --out dist)
          if [ "$ZIG" = "true" ]; then args+=(--zig); fi
          cargo run -p xtask --locked -- dist "${args[@]}"
          ls -l dist
      # The disk image: "Mokuro Bunko.app" + an Applications link, no OCR inside (the
      # wizard downloads the backend pack and models on demand). Named like the archive
      # it is made from: mokuro-bunko-<ver>-<target>-<flavor>.dmg. A release asset only,
      # not in release.json: the updater replaces the binaries from the .tar.gz.
      - name: disk image (dmgbuild)
        if: runner.os == 'macOS'
        env:
          # dmgbuild 1.6.7 (MIT; ds_store, mac_alias: MIT), pinned for the build only.
          DMGBUILD_VERSION: "1.6.7"
        run: |
          set -eux
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install -q --disable-pip-version-check "dmgbuild==$DMGBUILD_VERSION"
          archive=$(ls dist/mokuro-bunko-*-"$TARGET"-"$FLAVOR".tar.gz)
          dmg="${archive%.tar.gz}.dmg"
          # hdiutil on hosted runners sometimes fails with "Resource busy": retry.
          for attempt in 1 2 3; do
            if DMGBUILD="$RUNNER_TEMP/dmgbuild/bin/dmgbuild" packaging/macos/make-dmg.sh "$archive" "$dmg"; then
              break
            fi
            [ "$attempt" -lt 3 ] || exit 1
            sleep 15
          done
          hdiutil imageinfo "$dmg" | head -n 12
          # The volume holds the app (with its CLI and tray) and the Applications link.
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          ls -la "$mnt"
          test -x "$mnt/Mokuro Bunko.app/Contents/MacOS/mokuro-bunko"
          test -x "$mnt/Mokuro Bunko.app/Contents/MacOS/mokuro-bunko-tray"
          test "$(readlink "$mnt/Applications")" = /Applications
          test ! -e "$mnt/Mokuro Bunko.app/Contents/Resources/ocr-offline"
          if [ "$TARGET" = aarch64-apple-darwin ]; then
            "$mnt/Mokuro Bunko.app/Contents/MacOS/mokuro-bunko" --version
          fi
          hdiutil detach "$mnt"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # Linux x86_64 full: in a manylinux_2_28 container (AlmaLinux 8, glibc 2.28,
  # gcc-toolset-14), so the binary runs on glibc >= 2.28 with the distribution's
  # libstdc++ (Debian 12, Ubuntu 22.04, RHEL 8+), like 0.5.2's wheels. ONNX Runtime
  # 1.28's static libraries need GCC 13's libstdc++ (GLIBCXX_3.4.31); gcc-toolset links
  # those parts statically (libstdc++_nonshared.a). packaging/manylinux/build.sh is the
  # same recipe for local builds.
  build-linux-full:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      CARGO_HOME: /github/home/.cargo
      RUSTUP_HOME: /github/home/.rustup
      OUT: dist
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: build (xtask dist, then show the glibc/GLIBCXX versions the binary needs)
        run: packaging/manylinux/build.sh full tray
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x64-full
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
      # The desktop tray (glibc 2.28 + GTK 3) for the x86_64 lite archive.
      - uses: actions/upload-artifact@v4
        with:
          name: tray-linux-x64
          path: dist/mokuro-bunko-tray
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # Linux x86_64 lite: the static musl CLI (zig), plus the manylinux job's glibc tray
  # (a tray needs glibc and GTK 3 anyway; the CLI stays static).
  build-linux-x64-lite:
    needs: build-linux-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64-lite
      - uses: actions/download-artifact@v4
        with:
          name: tray-linux-x64
          path: tray
      - name: xtask dist
        run: |
          set -eux
          chmod +x tray/mokuro-bunko-tray
          cargo run -p xtask --locked -- dist --locked --zig --target x86_64-unknown-linux-musl \
            --flavor lite --tray-bin tray/mokuro-bunko-tray --out dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x64-lite
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  # OCR backend packs (docs/rust-port/TORCH-BACKEND.md, PACKAGING.md §8): libtorch
  # 2.13.0 of each variant, trimmed, with libbunko_torch built against it, as
  # mokuro-bunko-<ver>-<target>-torch-<variant>.tar.zst (split in .001/.002 parts
  # above 1.9 GiB). The NVIDIA libraries are not in the archives: pack.json lists
  # NVIDIA's PyPI wheels (pinned by sha256) and `install-ocr` fetches them.
  packs:
    name: pack ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64-cpu, os: windows-latest, target: x86_64-pc-windows-msvc, variant: cpu }
          - { name: windows-x64-cu130, os: windows-latest, target: x86_64-pc-windows-msvc, variant: cu130 }
          - { name: macos-arm64-cpu, os: macos-latest, target: aarch64-apple-darwin, variant: cpu }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      BUNKO_PACK_CACHE: ${{ github.workspace }}/pack-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: pack-${{ matrix.name }}
      # torch-sys 0.26 compiles libtch against libtorch 2.13's headers with /std:c++17:
      # the runner's MSVC (Visual Studio 18) rejects those headers in C++17 (C7555:
      # designated initializers) and libtch in C++20 (`module` as a name). clang-cl (MSVC
      # ABI) accepts both. This wrapper drops torch-sys's MSBuild-style /p: argument,
      # which clang-cl would take for a file, and turns C++ exceptions on (/EHsc), as
      # cl.exe has them. The same wrapper as torch-export-win.yml; only the pack's C++
      # (torch-sys, the bunko-torch shim) is compiled with it.
      - name: clang-cl wrapper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl).Source
          & $clang --version | Select-Object -First 1
          $w = "$env:RUNNER_TEMP\clwrap"; New-Item -ItemType Directory -Force $w | Out-Null
          @"
          fn main() {
              let args: Vec<_> = std::env::args_os().skip(1).filter(|a| !a.to_string_lossy().starts_with("/p:")).collect();
              let st = std::process::Command::new(r"$clang").arg("/EHsc").args(&args).status().expect("clang-cl");
              std::process::exit(st.code().unwrap_or(1));
          }
          "@ | Set-Content "$w\clwrap.rs"
          rustc -O "$w\clwrap.rs" -o "$w\clang-cl-wrap.exe"
          if ($LASTEXITCODE) { throw "wrapper build failed" }
          "BUNKO_CLANG_CL_WRAP=$w\clang-cl-wrap.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: xtask torch-pack
        env:
          TARGET: ${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -eux
          # xtask itself is built with the default compilers; only its torch-pack build
          # of bunko-torch sees the wrapper.
          cargo build -p xtask --locked
          if [ -n "${BUNKO_CLANG_CL_WRAP:-}" ]; then
            export CXX_x86_64_pc_windows_msvc="$BUNKO_CLANG_CL_WRAP" CC_x86_64_pc_windows_msvc="$BUNKO_CLANG_CL_WRAP"
          fi
          xtask=target/debug/xtask
          if [ -f "$xtask.exe" ]; then xtask="$xtask.exe"; fi
          "$xtask" torch-pack --locked --variant "$VARIANT" --target "$TARGET" --out dist
          rm -rf "$BUNKO_PACK_CACHE"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.name }}
          path: dist/*.tar.zst*
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention-days }}

  # The Linux packs, built in the same manylinux_2_28 image as the Linux full binary
  # (libbunko_torch must run where the binary runs; the cu130 pack's stubs for cuFile,
  # NVSHMEM and nvJitLink are compiled there too).
  packs-linux:
    name: pack linux-x64-${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cu130, rocm7.1]
    runs-on: ubuntu-latest
    steps:
      # The ROCm zip is 5.4 GiB and unpacks the kept libraries to ~7 GiB.
      - name: free disk space
        if: matrix.variant == 'rocm7.1'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: xtask torch-pack (manylinux_2_28)
        run: |
          set -eux
          docker run --rm -v "$PWD:/src" -w /src -e SOURCE_DATE_EPOCH -e OUT=dist \
            -e CARGO_HOME=/src/.mb/cargo -e RUSTUP_HOME=/src/.mb/rustup -e CARGO_TARGET_DIR=/src/.mb/target \
            quay.io/pypa/manylinux_2_28_x86_64 packaging/manylinux/build.sh "${{ matrix.variant }}"
          sudo rm -rf .mb
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: pack-linux-x64-${{ matrix.variant }}
          path: dist/*.tar.zst*
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention-days }}

  # Android APK (docs/rust-port/MOBILE.md): the lite server as a JNI library
  # (crates/bunko-android, cargo ndk for arm64-v8a + x86_64) in the Kotlin app under
  # packaging/android. A release asset only: it is not in release.json (the app updates
  # by store/sideload; the updater reports InstallKind::Mobile). Off unless the caller
  # asks (release.yml: the repository variable BUILD_ANDROID = "true").
  #
  # Signing: the secrets ANDROID_KEYSTORE_BASE64 (base64 of a .jks/.keystore),
  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them the
  # APK is signed with a throwaway debug key, and users cannot update it in place.
  android:
    # Android is out of 0.7's scope (owner, 2026-10-03).
    if: inputs.android
    runs-on: ubuntu-latest
    env:
      CARGO_LOCKED: "1"
      NDK_VERSION: "29.0.14206865"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Android SDK packages (platform 36, build-tools, NDK)
        run: |
          set -eux
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a debug key (see docs/rust-port/MOBILE.md)"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "BUNKO_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore"
            echo "BUNKO_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BUNKO_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "BUNKO_ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - name: build.sh (native libraries, licences, assembleRelease)
        run: packaging/android/build.sh --out dist-android
      - name: check the APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eux
          apk="dist-android/mokuro-bunko-$VERSION-android.apk"
          bt=$(find "$ANDROID_HOME"/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          "$bt/apksigner" verify --print-certs "$apk"
          "$bt/zipalign" -c -P 16 4 "$apk"
          unzip -l "$apk" | grep -E 'lib/(arm64-v8a|x86_64)/libbunko_android.so'
          unzip -l "$apk" | grep -E 'assets/THIRD-PARTY-LICENSES.md'
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-android/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
