# Build a release from a `v*` tag: every platform archive, the signed release.json,
# a DRAFT GitHub release, and versioned Docker images. Nothing here is visible to the
# updater or to `:latest` users: the owner reviews the draft and then runs the
# "Publish" workflow (publish.yml), which un-drafts the release and moves the
# `latest*` image tags. See docs/rust-port/PACKAGING.md.
#
# Needs the repository secret BUNKO_SIGNING_KEY (base64 ed25519 seed of the release
# key whose public half is compiled into bunko-update).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.7.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      image: ${{ steps.v.outputs.image }}
      epoch: ${{ steps.v.outputs.epoch }}
    steps:
      - name: validate tag
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "bad tag: $TAG"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: tag matches the workspace version
        run: |
          set -eu
          version="${TAG#v}"
          ws=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="mokuro-bunko") | .version')
          [ "$ws" = "$version" ] || { echo "tag $TAG != workspace version $ws"; exit 1; }
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/mokuro-bunko"
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$pre"
            echo "image=$image"
            echo "epoch=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"
      - name: signing key is configured
        env:
          BUNKO_SIGNING_KEY: ${{ secrets.BUNKO_SIGNING_KEY }}
        run: |
          if [ -z "$BUNKO_SIGNING_KEY" ]; then
            echo "::error::Add the BUNKO_SIGNING_KEY repository secret (see docs/rust-port/PACKAGING.md)"
            exit 1
          fi

  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build:
    needs: prepare
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux lite: fully static musl, cross-built with zig.
          - { name: linux-x64-lite, os: ubuntu-latest, target: x86_64-unknown-linux-musl, flavor: lite, zig: true }
          - { name: linux-arm64-lite, os: ubuntu-latest, target: aarch64-unknown-linux-musl, flavor: lite, zig: true }
          # Linux full: glibc (ONNX Runtime has no musl build), built natively on the
          # oldest supported Ubuntu so the binary runs on glibc >= 2.35.
          - { name: linux-x64-full, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, flavor: full }
          - { name: linux-x64-full-cuda, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, flavor: full, ep: cuda }
          - { name: linux-arm64-full, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, flavor: full }
          # Windows: full = DirectML, full-cuda = CUDA (+DirectML), lite.
          - { name: windows-x64-full, os: windows-latest, target: x86_64-pc-windows-msvc, flavor: full }
          - { name: windows-x64-full-cuda, os: windows-latest, target: x86_64-pc-windows-msvc, flavor: full, ep: cuda }
          - { name: windows-x64-lite, os: windows-latest, target: x86_64-pc-windows-msvc, flavor: lite }
          # macOS: full = CoreML (arm64 only: ort ships no x86_64 macOS ONNX Runtime), lite per arch.
          - { name: macos-arm64-full, os: macos-latest, target: aarch64-apple-darwin, flavor: full }
          - { name: macos-arm64-lite, os: macos-latest, target: aarch64-apple-darwin, flavor: lite }
          - { name: macos-x64-lite, os: macos-latest, target: x86_64-apple-darwin, flavor: lite }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
      TARGET: ${{ matrix.target }}
      FLAVOR: ${{ matrix.flavor }}
      EP: ${{ matrix.ep }}
      ZIG: ${{ matrix.zig }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.zig
        uses: mlugg/setup-zig@v2
      - if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: xtask dist
        run: |
          set -eux
          args=(--locked --target "$TARGET" --flavor "$FLAVOR" --out dist)
          if [ -n "$EP" ]; then args+=(--ep "$EP"); fi
          if [ "$ZIG" = "true" ]; then args+=(--zig); fi
          cargo run -p xtask --locked -- dist "${args[@]}"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # Android APK (docs/rust-port/MOBILE.md): the lite server as a JNI library
  # (crates/bunko-android, cargo ndk for arm64-v8a + x86_64) in the Kotlin app under
  # packaging/android. A release asset only: it is not in release.json (the app updates
  # by store/sideload; the updater reports InstallKind::Mobile). On by default; set the
  # repository variable BUILD_ANDROID to "false" to skip it.
  #
  # Signing: the secrets ANDROID_KEYSTORE_BASE64 (base64 of a .jks/.keystore),
  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them the
  # APK is signed with a throwaway debug key, and users cannot update it in place.
  android:
    needs: prepare
    if: vars.BUILD_ANDROID != 'false'
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
      CARGO_LOCKED: "1"
      NDK_VERSION: "29.0.14206865"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Android SDK packages (platform 36, build-tools, NDK)
        run: |
          set -eux
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a debug key (see docs/rust-port/MOBILE.md)"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "BUNKO_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore"
            echo "BUNKO_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BUNKO_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "BUNKO_ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - name: build.sh (native libraries, licences, assembleRelease)
        run: packaging/android/build.sh --out dist-android
      - name: check the APK
        run: |
          set -eux
          apk="dist-android/mokuro-bunko-${{ needs.prepare.outputs.version }}-android.apk"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$bt/apksigner" verify --print-certs "$apk"
          "$bt/zipalign" -c -P 16 4 "$apk"
          unzip -l "$apk" | grep -E 'lib/(arm64-v8a|x86_64)/libbunko_android.so'
          unzip -l "$apk" | grep -E 'assets/THIRD-PARTY-LICENSES.md'
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-android/*
          if-no-files-found: error

  release:
    needs: [prepare, test, build, android]
    # android may be skipped (BUILD_ANDROID=false); everything else must have passed.
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' && needs.test.result == 'success'
      && needs.build.result == 'success'
      && (needs.android.result == 'success' || needs.android.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # Kept out of dist/: the APK is a release asset, not a release.json artifact.
      - if: needs.android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist-android
      - name: release.json
        run: |
          set -eux
          published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cargo run -q -p xtask --locked -- manifest --version "$VERSION" --dir dist \
            --published-at "$published_at" --docker-repo "$IMAGE"
          cat dist/release.json
      - name: sign
        env:
          BUNKO_SIGNING_KEY: ${{ secrets.BUNKO_SIGNING_KEY }}
        run: cargo run -q -p xtask --locked -- sign dist/release.json
      - name: verify with the key compiled into bunko-update
        run: cargo run -q -p xtask --locked -- verify dist/release.json --dir dist --require-all
      - name: draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          files=(dist/*.tar.gz dist/*.zip dist/release.json dist/release.json.sig dist/SHA256SUMS)
          if compgen -G 'dist-android/*.apk' > /dev/null; then
            files+=(dist-android/*.apk dist-android/*.apk.sha256)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run: replace the assets of the existing (draft) release.
            gh release upload "$TAG" --clobber "${files[@]}"
          else
            flags=(--draft --verify-tag --title "mokuro-bunko $VERSION" --generate-notes)
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${flags[@]}" "${files[@]}"
          fi

  docker:
    needs: [prepare, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      IMAGE: ${{ needs.prepare.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-linux-*
          path: dist
          merge-multiple: true
      # The images reuse the release binaries (BIN_FROM=prebuilt): no second compile,
      # and the arm64 images need no emulated build.
      - name: docker context (release binaries + bunko-init per arch)
        run: cargo run -q -p xtask --locked -- docker-context --version "$VERSION" --dir dist --out dist/docker --zig
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: lite (static musl on distroless)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.lite
          platforms: linux/amd64,linux/arm64
          build-args: |
            BIN_FROM=prebuilt
            VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-lite
          push: true
      - name: full (CPU, with optional nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BIN_FROM=prebuilt
            VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          push: true
      - name: cuda (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.cuda
          platforms: linux/amd64
          build-args: |
            BIN_FROM=prebuilt
            VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-cuda
          push: true
