# Build a release from a `v*` tag: every platform archive, the macOS disk images, the
# backend packs, the signed release.json, a DRAFT GitHub release, and versioned Docker
# images. Nothing here is visible to the updater or to `:latest` users: the owner
# reviews the draft and then runs the "Publish" workflow (publish.yml), which un-drafts
# the release and moves the `latest*` image tags. See docs/rust-port/PACKAGING.md.
#
# The build jobs are release-build.yml and release-docker.yml (reusable workflows);
# release-check.yml runs the same two on any branch without a tag, signing and
# publishing nothing.
#
# Needs the repository secret BUNKO_SIGNING_KEY (base64 ed25519 seed of the release
# key whose public half is compiled into bunko-update).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.7.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      image: ${{ steps.v.outputs.image }}
      epoch: ${{ steps.v.outputs.epoch }}
    steps:
      - name: validate tag
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "bad tag: $TAG"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: tag matches the workspace version
        run: |
          set -eu
          version="${TAG#v}"
          ws=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="mokuro-bunko") | .version')
          [ "$ws" = "$version" ] || { echo "tag $TAG != workspace version $ws"; exit 1; }
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/mokuro-bunko"
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$pre"
            echo "image=$image"
            echo "epoch=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"
      - name: signing key is configured
        env:
          BUNKO_SIGNING_KEY: ${{ secrets.BUNKO_SIGNING_KEY }}
        run: |
          if [ -z "$BUNKO_SIGNING_KEY" ]; then
            echo "::error::Add the BUNKO_SIGNING_KEY repository secret (see docs/rust-port/PACKAGING.md)"
            exit 1
          fi

  # Tests, every archive, the macOS disk images, the backend packs and (opt-in) the
  # APK: release-build.yml, the same jobs release-check.yml runs without a tag.
  build:
    needs: prepare
    uses: ./.github/workflows/release-build.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      epoch: ${{ needs.prepare.outputs.epoch }}
      # Android is out of 0.7's scope (owner, 2026-10-03): opt in with BUILD_ANDROID=true.
      android: ${{ vars.BUILD_ANDROID == 'true' }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: pack-*
          path: dist
          merge-multiple: true
      # Kept out of dist/: the APK is a release asset, not a release.json artifact.
      - if: vars.BUILD_ANDROID == 'true'
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist-android
      - name: release.json
        run: |
          set -eux
          published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cargo run -q -p xtask --locked -- manifest --version "$VERSION" --dir dist \
            --published-at "$published_at" --docker-repo "$IMAGE"
          cat dist/release.json
      - name: sign
        env:
          BUNKO_SIGNING_KEY: ${{ secrets.BUNKO_SIGNING_KEY }}
        run: cargo run -q -p xtask --locked -- sign dist/release.json
      - name: verify with the key compiled into bunko-update
        run: cargo run -q -p xtask --locked -- verify dist/release.json --dir dist --require-all
      - name: draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          # The macOS disk images are assets but not release.json artifacts (the updater
          # takes the .tar.gz); SHA256SUMS lists them.
          files=(dist/*.tar.gz dist/*.zip dist/*.dmg dist/*.tar.zst* dist/release.json dist/release.json.sig dist/SHA256SUMS)
          if compgen -G 'dist-android/*.apk' > /dev/null; then
            files+=(dist-android/*.apk dist-android/*.apk.sha256)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run: replace the assets of the existing (draft) release.
            gh release upload "$TAG" --clobber "${files[@]}"
          else
            flags=(--draft --verify-tag --title "mokuro-bunko $VERSION" --generate-notes)
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${flags[@]}" "${files[@]}"
          fi

  # The versioned images (`:<ver>-lite`, `:<ver>`, `:<ver>-cuda`) from this run's
  # Linux binaries; publish.yml moves `latest*` for stable versions only.
  docker:
    needs: [prepare, build]
    uses: ./.github/workflows/release-docker.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      image: ${{ needs.prepare.outputs.image }}
      push: true
