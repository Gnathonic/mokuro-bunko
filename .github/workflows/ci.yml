name: CI

on:
  push:
    branches: [main, "rust/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --check --manifest-path packaging/docker-init/Cargo.toml

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The full build (default features, links ONNX Runtime) and the lite build.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p mokuro-bunko --all-targets --locked --no-default-features -- -D warnings
      # The ONNX Runtime GPU execution providers are not released in 0.7 but must keep compiling.
      - run: cargo clippy -p mokuro-bunko --locked --features cuda,webgpu -- -D warnings
      - run: cargo clippy --locked --manifest-path packaging/docker-init/Cargo.toml -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: lite build compiles and tests on every OS
        run: cargo test -p mokuro-bunko --locked --no-default-features

  # The lite build as it ships: a static musl binary packaged by xtask, then the
  # release tooling end to end (manifest, sign, verify, install.sh) with a throwaway key.
  lite-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
      - name: xtask dist (runs `--version` on the packaged binary)
        run: cargo run -p xtask --locked -- dist --locked --zig --target x86_64-unknown-linux-musl --flavor lite --out dist
      - name: static, and runs from the archive
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/x"
          tar -xzf dist/mokuro-bunko-*-x86_64-unknown-linux-musl-lite.tar.gz -C "$RUNNER_TEMP/x"
          bin=$(echo "$RUNNER_TEMP"/x/mokuro-bunko-*/mokuro-bunko)
          file "$bin" | grep -q 'statically linked'
          "$bin" --version | tee /dev/stderr | grep -q lite
          ls -l "$bin" dist/
      - name: manifest, sign, verify
        run: |
          set -eux
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="mokuro-bunko") | .version')
          cargo run -q -p xtask --locked -- manifest --version "$version" --dir dist --base-url http://127.0.0.1:18731
          pk=$(cargo run -q -p xtask --locked -- keygen --out "$RUNNER_TEMP/ci.key")
          echo "CI_PUBLIC_KEY=$pk" >> "$GITHUB_ENV"
          cargo run -q -p xtask --locked -- sign dist/release.json --key "$RUNNER_TEMP/ci.key" --public-key "$pk"
          cargo run -q -p xtask --locked -- verify dist/release.json --public-key "$pk" --dir dist --require-all
          # The real release key must not accept a throwaway signature.
          if cargo run -q -p xtask --locked -- verify dist/release.json; then exit 1; fi
      - name: install.sh against the local release
        run: |
          set -eux
          (cd dist && python3 -m http.server 18731 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          MOKURO_BUNKO_BASE_URL=http://127.0.0.1:18731 MOKURO_BUNKO_PUBLIC_KEY="$CI_PUBLIC_KEY" \
            sh scripts/install.sh --flavor lite --require-signature --prefix "$RUNNER_TEMP/inst"
          "$RUNNER_TEMP/inst/bin/mokuro-bunko" --version
          # A wrong key is refused.
          if MOKURO_BUNKO_BASE_URL=http://127.0.0.1:18731 sh scripts/install.sh --dry-run; then exit 1; fi
      - name: licence audit (fails on copyleft)
        run: |
          set -eux
          cargo run -q -p xtask --locked -- licenses --target x86_64-unknown-linux-musl --flavor lite
          cargo run -q -p xtask --locked -- licenses --target x86_64-unknown-linux-gnu --flavor full
          cargo run -q -p xtask --locked -- licenses --target x86_64-pc-windows-msvc --flavor full
          cargo run -q -p xtask --locked -- licenses --target aarch64-apple-darwin --flavor full

  # The CPU OCR backend pack: libtorch download, trim, libbunko_torch build, closure
  # check, archive; then install-ocr installs and verifies it offline (--from).
  cpu-pack:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      CARGO_HOME: /github/home/.cargo
      RUSTUP_HOME: /github/home/.rustup
    steps:
      - uses: actions/checkout@v4
      - name: xtask torch-pack --variant cpu (manylinux_2_28)
        run: OUT=dist packaging/manylinux/build.sh cpu
      - name: install-ocr --from dist
        run: |
          set -eux
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo run -p mokuro-bunko --locked -- -c "$RUNNER_TEMP/c.yaml" install-ocr --variant cpu \
            --from dist --dir "$RUNNER_TEMP/backends" --no-models
          test -f "$RUNNER_TEMP/backends/torch-cpu-2.13.0/pack.json"
          test -f "$RUNNER_TEMP/backends/torch-cpu-2.13.0/libbunko_torch.so"

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/install.sh deploy/docker/entrypoint.sh
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          foreach ($f in "scripts/install.ps1", "scripts/setup-windows.ps1") {
            $tokens = $null; $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$errs)
            if ($errs.Count) { $errs | ForEach-Object { Write-Error "${f}: $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          }
      - name: nginx template renders and passes nginx -t
        run: |
          docker run --rm -v "$PWD/deploy/nginx-internal.conf.template:/t:ro" \
            -e MOKURO_PORT=8080 -e MOKURO_BACKEND_PORT=8081 -e MOKURO_LIBRARY=/data/library nginx:alpine \
            sh -c 'envsubst "\${MOKURO_PORT} \${MOKURO_BACKEND_PORT} \${MOKURO_LIBRARY}" </t >/tmp/n.conf && mkdir -p /data/library && nginx -t -c /tmp/n.conf'
      - name: compose files are valid
        run: for f in deploy/docker-compose*.yml; do docker compose -f "$f" config -q; done
        env:
          CLOUDFLARE_TUNNEL_TOKEN: dummy

  docker-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the lite image from source
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.lite
          load: true
          tags: mokuro-bunko:ci-lite
          cache-from: type=gha,scope=lite
          cache-to: type=gha,scope=lite,mode=max
      - name: run it
        run: |
          set -eux
          docker run --rm mokuro-bunko:ci-lite --version | grep -q lite
          docker run --rm -e PUID=4242 -e PGID=4242 -v "$RUNNER_TEMP/data:/data" mokuro-bunko:ci-lite --version
          test "$(stat -c %u:%g "$RUNNER_TEMP/data")" = "4242:4242"
          docker image ls mokuro-bunko:ci-lite
