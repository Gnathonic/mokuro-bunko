# Dependabot version updates. Security updates are enabled separately in the
# repo settings and still apply to every ecosystem below, including the ones
# with `open-pull-requests-limit: 0` (that setting only turns off routine
# version-bump PRs).
#
# `cooldown` holds back routine bumps until a release is a week old, which
# gives time for a compromised or broken release to be yanked. Security
# updates ignore the cooldown.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/packaging/docker-init"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # These are pinned exactly to the OCR pack ABI (onnxruntime / libtorch).
      # Moving them means rebuilding and re-blessing the packs (PACKAGING.md),
      # so they are bumped by hand, not by bot.
      - dependency-name: ort
      - dependency-name: tch
      - dependency-name: torch-sys
      # bunko-tray's own zbus (the `doctor` check) follows the zbus major that
      # ksni uses, so the tray links one copy. Move it when ksni moves.
      - dependency-name: zbus
        update-types: ["version-update:semver-major"]
      # bunko-android stays on jni 0.21 (see its Cargo.toml): 0.22 reworks the
      # API, and the Android build is opt-in.
      - dependency-name: jni
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      # Pinned to a commit of its master branch; the toolchain is the step's
      # `toolchain` input (`stable`, or the workspace rust-version in the msrv
      # job, which moves with Cargo.toml). The action has no releases to follow,
      # so the pin is moved by hand.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - "/deploy/docker"
      - "/tools/torch_export/docker"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: "/packaging/android"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      android:
        patterns: ["*"]

  # The export toolchains are pinned to exact torch/CUDA builds that define the
  # pack ABI, so routine bumps are off; security updates still apply.
  - package-ecosystem: pip
    directory: "/tools/torch_export"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: uv
    directory: "/tools/onnx_export"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
