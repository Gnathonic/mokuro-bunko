# Mokuro Bunko Server Configuration
# Copy this file to ~/.config/mokuro-bunko/config.yaml (Linux/macOS)
# or %LOCALAPPDATA%\mokuro-bunko\config.yaml (Windows)

server:
  # Host to bind to (0.0.0.0 for all interfaces)
  host: "0.0.0.0"
  # Port to listen on
  port: 8080
  # Reverse proxies on ANOTHER host or container whose X-Forwarded-For is
  # believed (a proxy on this machine always is). Example: ["172.16.0.0/12"]
  trusted_proxies: []

storage:
  # Base path for all data storage
  # Default: ~/.local/share/mokuro-bunko (Linux/macOS)
  #          %LOCALAPPDATA%\mokuro-bunko (Windows)
  base_path: "/var/lib/mokuro-bunko"

registration:
  # Registration mode:
  # - disabled: Admin creates all accounts
  # - self: Open registration with default role
  # - invite: Invite codes required
  # - approval: Admin must approve new accounts
  mode: "self"
  # Default role for new users (registered, uploader, inviter, or editor)
  default_role: "registered"
  # Anonymous WebDAV access controls
  # - browse: allow PROPFIND/listing without login
  # - download: allow GET/HEAD file downloads without login
  allow_anonymous_browse: true
  allow_anonymous_download: true
  # Older shorthand for turning both of the above off. Only read when neither
  # allow_anonymous_* key is set.
  # require_login: false

cors:
  # Enable CORS headers
  enabled: true
  # Allowed origins (supports * wildcard for port)
  allowed_origins:
    - "https://reader.mokuro.app"
    - "http://localhost:5173"
    - "http://localhost:*"
    - "http://127.0.0.1:*"
  # Allow credentials (cookies, authorization headers)
  allow_credentials: true

ssl:
  # Enable HTTPS
  enabled: false
  # Auto-generate self-signed certificate
  auto_cert: false
  # Path to SSL certificate (required if enabled and not auto_cert)
  cert_file: ""
  # Path to SSL private key (required if enabled and not auto_cert)
  key_file: ""

admin:
  # Enable admin web panel
  enabled: true
  # URL path for admin panel
  path: "/_admin"

catalog:
  # Enable public catalog at /catalog
  enabled: false
  # Where catalog volume links open for reading
  reader_url: "https://reader.mokuro.app"
  # If true, browser requests to / redirect to /catalog/
  use_as_homepage: false
  # Fetch ratings, tags and genres from AniList/MAL for series linked to an
  # external id (no API key needed)
  enrich_community: true

queue:
  # Show Queue button in the top navigation bar
  show_in_nav: false
  # If false, queue status API requires authenticated user credentials
  public_access: true
  # How much the queue page shows, to every viewer:
  #   minimal   one line per working machine, the pending count, speeds
  #   normal    a card per machine, the pending list, failures (generic reasons)
  #   detailed  normal + stage pipelines and rate details, for tuning
  # Raw errors, log paths and hardware names reach admins only, at any level.
  display: normal

database:
  # How long each SQLite statement blocks waiting on a lock (milliseconds)
  busy_timeout_ms: 5000
  # Retries when an external process (e.g. the admin CLI) holds the write lock
  lock_retries: 5
  # First retry backoff delay in seconds; doubles on each subsequent retry
  retry_initial_delay_seconds: 0.05

ocr:
  # OCR backend:
  # - auto: Detect best available
  # - cuda: NVIDIA GPU
  # - rocm: AMD GPU
  # - cpu: CPU only
  # - skip: no OCR on THIS machine (the same as local_processing: false);
  #         a processor that logs in runs the queue, which holds until one does
  backend: auto
  # Seconds between library scans for volumes missing a sidecar or a
  # thumbnail. Also the base of the retry backoff for failed volumes.
  poll_interval: 30
  # How many OCR jobs run at once, 1-8 (default 1: one at a time, as before).
  # Concurrent jobs are always on DIFFERENT volumes. One job already keeps
  # 2-4 cores busy and holds its own copy of the model in RAM (or VRAM), so
  # roughly cores/3 is the useful ceiling; raising this past what the machine
  # has only makes every job slower. Takes effect at startup.
  concurrency: 1
  # Keep ONE OCR process open per generation and stream volumes through it,
  # so the models load once per session instead of once per volume. false
  # is the one-process-per-volume fallback; the sidecars are identical either
  # way. mokuro rows join in through mokuro's serve mode (if the installed
  # mokuro has none, they run one command per volume). Takes effect at
  # startup.
  sessions: true
  # Does the machine serving the library also run OCR? A small always-on box
  # sets this off and waits for `mokuro-bunko processor serve` to log in from
  # a stronger machine; the queue then holds, and says so, instead of
  # grinding for hours. Nothing is installed locally when it is off. At
  # startup.
  local_processing: true
  # A generation that has never been measured on a machine is benchmarked
  # there before that machine is offered its volumes, and the widths found
  # are kept in that machine's profile (never in this file). On this server
  # that happens only for a row whose pools are empty. Off means "run with
  # the derived settings and benchmark by hand". At startup.
  autobench: true
  # The OCR generations: named recipes, IN THE ORDER THE QUEUE RUNS THEM.
  # Every enabled row writes its own sidecar beside every archive, named
  # after the row -- `<Volume>.<name>.mokuro`, or the bare `<Volume>.mokuro`
  # for the one row flagged `primary`. Rearranging the rows is how the queue
  # is prioritised: every volume gets the first row's file before the second
  # row starts, and the first row is the only one at normal OS priority.
  #
  # Two rows may run the SAME engine with different detectors -- that is the
  # point of the list, since the detector changes the result as much as the
  # recognizer does.
  #
  #   id           server-minted (g-1, g-2, ...), never shown; keys every
  #                piece of internal state, so a rename or a reorder costs
  #                nothing but the file name. Leave it out for a new row.
  #   name         the label AND the file-name postfix. Editable.
  #                ^[a-z0-9][a-z0-9-]{0,31}$ -- lowercase ASCII, digits and
  #                hyphens, 32 characters at most. No dot, no uppercase, no
  #                space, no underscore: a name outside that grammar is
  #                SILENTLY invisible on every reader. `original`, `gcv` and
  #                anything starting with `tr-` are reserved. Unique across
  #                every row, enabled or not.
  #   primary      exactly one ENABLED row must have it. That row writes the
  #                bare <Volume>.mokuro: the only source of a volume's
  #                character counts and of the volume_uuid every other layer
  #                inherits. Any engine may be the primary one.
  #   enabled      a disabled row queues nothing and writes nothing; its name
  #                and its files stay reserved.
  #   engine       - mokuro:       manga-ocr via mokuro (its own detector)
  #                - hayai-nova:   hayai-ocr v2.5 Nova (reads at patch_budget)
  #                - paddle-manga: PaddleOCR-VL 1.6 + manga LoRA (~2 GB
  #                                weights, slowest, best accuracy)
  #                - ppocr-manga:  PP-OCRv6 manga, a 23 MB line detector +
  #                                CTC recognizer on the CPU; brings its own
  #                                detector and is the one engine that reads
  #                                scanned NOVEL pages
  #                hayai-nova, paddle-manga and ppocr-manga share a second
  #                environment, installed at startup when a row needs it (or
  #                up front: mokuro-bunko install-ocr --engines hayai-nova)
  #   detector     - ppocr-manga: (default) Apache-2.0 rotated line quads,
  #                               CPU only; the engine re-reads every line
  #                               and the two reads are merged
  #                - ctd:         GPL-3.0 comic-text-detector, mokuro-identical
  #                               lines; opt-in via install-ocr --detector ctd
  #                (animetext is disabled for now; a row naming it is refused)
  #                Ignored (and stored as null) when the engine brings its own.
  #   precision    the row's precision MODE, one for every machine:
  #                  auto-accuracy (default) what tested most accurate for
  #                                 the engine: hayai-nova bf16 where the
  #                                 card supports it, else fp32; paddle-manga
  #                                 and mokuro fp32. Never fp16.
  #                  auto-balanced  a little accuracy for a lot of speed
  #                  auto-speed     the fastest format each card runs well
  #                                 (these two: each machine's benchmark tries
  #                                 its supported candidates and keeps the
  #                                 fastest; within 5% the more accurate)
  #                  fp32 / bf16 / fp16  that format only; a machine whose
  #                                 card cannot run it is never given the
  #                                 row. mokuro has no bf16. ppocr-manga
  #                                 ignores the mode.
  #   patch_budget resolution hayai-nova reads a line at (256/384/512).
  #                Reaches no other engine. 512 is the default and is NOT the
  #                model card's own 384: on the author's benchmark 384 reads
  #                worse than the retired hayai v2 and only 512 beats it.
  #   pools        per-stage tuning of THIS row, {} to derive it. The keys are
  #                that row's stage keys (which depend on its engine and
  #                detector; the server refuses a key from another road).
  #                Never changes what is written, only how fast it is written.
  #                  stage_workers  how many pages that stage runs at once
  #                  queue_capacity how many may wait in the queue it fills
  #                  stage_device   WHERE that stage's model runs: cpu or
  #                                 gpu:<n>; absent = auto (card 0 when there
  #                                 is one). Only a stage holding a model
  #                                 takes one -- detect and engine, or the
  #                                 `mokuro` stage of a mokuro row, which is
  #                                 the serve process (cpu there means
  #                                 --force_cpu, gpu:<n> hides the rest).
  #                                 A stage on a card runs one model and one
  #                                 worker; on the CPU it is a pool, which is
  #                                 what makes "detector on the CPU, engine
  #                                 on the card" worth asking for.
  #
  # See docs/configuration.md for the full reference and
  # docs/ocr-internals.md for how it works.
  #
  # Renaming a row simply means its files are looked for under the new name:
  # volumes re-OCR under it and the old files are left where they are. A job
  # already running when its row is renamed finishes under the name it
  # started with.
  generations:
    - name: mokuro
      engine: mokuro
      primary: true
      enabled: true
      patch_budget: 512
      pools:
        stage_workers: {}
        queue_capacity: {}
        stage_device: {}
    # A second recipe, on a different engine and detector:
    # - name: hayai-nova-ctd
    #   engine: hayai-nova
    #   detector: ctd
    #   precision: auto-balanced
    #   pools:
    #     stage_workers: {detect: 4, post: 2}
    #     stage_device: {detect: cpu, engine: "gpu:0"}
    # The same engine again, on another detector -- a different file:
    # - name: hayai-nova-ppocr-manga
    #   engine: hayai-nova
    #   detector: ppocr-manga
