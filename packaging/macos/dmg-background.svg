<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <!-- The disk image window's background (make-dmg.sh): the app sits at (160,190), the
       Applications alias at (480,190). Original artwork, MPL-2.0 like the project. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8f7"/>
      <stop offset="1" stop-color="#e3ece9"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect x="0" y="0" width="640" height="6" fill="#3d8577"/>
  <text x="320" y="62" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="600" fill="#24312d">Install Mokuro Bunko</text>
  <text x="320" y="90" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="14" fill="#4b5a55">Drag the app onto the Applications folder.</text>
  <!-- arrow from the app to Applications -->
  <path d="M248 190 H372" stroke="#3d8577" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M366 174 L394 190 L366 206 Z" fill="#3d8577"/>
  <text x="320" y="330" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="13" fill="#4b5a55">Then open Mokuro Bunko from Applications: a book icon appears</text>
  <text x="320" y="350" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="13" fill="#4b5a55">in the menu bar and the setup wizard opens in your browser.</text>
</svg>
