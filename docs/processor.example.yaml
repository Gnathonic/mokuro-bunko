# mokuro-bunko processor -- the whole configuration of an OCR processor (0.7).
#
# The easy way to make this file is not to: `processor setup` asks for the
# library URL, username and password, checks them against the library, and
# writes a processor.yaml holding only what differs from the defaults below
# (then offers to start the processor with the machine):
#
#   mokuro-bunko processor setup
#
# By hand, copy this file, set the three `library` values, keep it private
# (mode 600: it holds a password), then:
#
#   mokuro-bunko processor serve   --config processor.yaml
#   mokuro-bunko processor status  --config processor.yaml
#   mokuro-bunko processor service --config processor.yaml --install  # start with the machine
#
# The full walkthrough, for Linux, Windows, macOS and Docker, is in
# docs/deployment.md ("Remote OCR processors").
#
# A processor needs a FULL build of mokuro-bunko (it carries the OCR
# engines); the lite build cannot run one. The OCR models (a few hundred MB
# to several GB, depending on the engines the library asks for) are downloaded
# on first use and checked by sha256; `mokuro-bunko models download` fetches
# them up front.
#
# This machine holds no library, no users and no admin UI: it logs in to a
# library server as an ordinary account whose role is `processor`, and runs
# whatever that server sends it. The library and the processor must both be
# 0.7 (protocol v3).

library:
  # Where the library server is, exactly as a browser would reach it. A path
  # prefix (https://example.org/bunko) is kept.
  url: https://library.example:8080
  # An account created with: mokuro-bunko admin add-user gpu-box --role processor
  username: gpu-box
  password: change-me
  # Instead of `password`, the first line of a file (relative to this one).
  # MOKURO_PROCESSOR_PASSWORD, when set, overrides both.
  # password_file: processor.password
  # true to verify the library's certificate normally, false to skip
  # verification (a self-signed certificate on a LAN), or the path to the
  # certificate to trust.
  tls_verify: true

processor:
  # How the library shows this machine to its admins. Defaults to the hostname.
  name: gpu-box
  # What the public queue page calls it. Unset, visitors see a numbered alias
  # ("machine 1") -- never the name above. At most 64 characters.
  # public_name: the big GPU box
  # How many OCR pipelines this hardware can hold at once -- one per card is
  # the rule, the same one `ocr.concurrency` follows on the library server.
  max_sessions: 1
  # Logs, the volume workspaces, archives too big for memory and the status
  # file -- one storage per processor; a second processor on the same storage
  # refuses to start.
  # Defaults to $XDG_DATA_HOME/mokuro-bunko-processor (~/.local/share/...)
  # on Linux and macOS, and %LOCALAPPDATA%\mokuro-bunko-processor on Windows.
  # storage: /data/mokuro-bunko-processor
  # RAM the queued archives may use: the volume being read and the one on
  # deck, across all sessions. On Linux they are held as in-memory files
  # (nothing to clean up, even after a crash); an archive that does not fit
  # goes to `storage` on disk instead. 0 = always disk. Other platforms always
  # use the disk.
  archive_memory_mb: 2048

# The 0.5 `ocr:` section (ocr.backend picked a torch build) is accepted and
# ignored: the processor carries its engines. The execution provider is chosen
# automatically (`processor setup --backend` can force one).
